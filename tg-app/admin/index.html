<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>СтройДом — Панель управления</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --surface:   #161923;
      --surface2:  #1e2330;
      --border:    rgba(255,255,255,0.07);
      --border2:   rgba(255,255,255,0.12);
      --accent:    #2AABEE;
      --accent-dim: rgba(42,171,238,0.15);
      --success:   #34d058;
      --warning:   #f0a500;
      --danger:    #f85149;
      --text:      #e6edf3;
      --text-muted: #7d8590;
      --text-dim:  #484f58;
      --mono:      'JetBrains Mono', monospace;
      --sans:      'DM Sans', -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Login ───────────────────────── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 16px;
      padding: 40px 36px;
    }

    .login-logo {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .login-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .login-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .field-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .field-input:focus { border-color: var(--accent); }

    .btn-primary {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      background: var(--accent);
      color: #fff;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.18s, transform 0.15s;
    }

    .btn-primary:hover  { opacity: 0.9; }
    .btn-primary:active { transform: scale(0.98); }

    .login-error {
      margin-top: 12px;
      padding: 10px 14px;
      background: rgba(248,81,73,0.12);
      border: 1px solid rgba(248,81,73,0.3);
      border-radius: 8px;
      color: var(--danger);
      font-size: 13px;
      display: none;
    }

    /* ── App shell ───────────────────── */
    #app-screen { display: none; min-height: 100vh; }

    /* Sidebar */
    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .sidebar-brand {
      padding: 0 20px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .sidebar-brand-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .sidebar-brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 0;
      transition: background 0.15s, color 0.15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover  { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--accent-dim); color: var(--accent); }

    .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 20px 0;
      border-top: 1px solid var(--border);
    }

    .logout-btn {
      font-size: 12px;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 0;
      font-family: var(--sans);
      transition: color 0.15s;
    }

    .logout-btn:hover { color: var(--danger); }

    /* Main */
    .main-content {
      flex: 1;
      padding: 28px 32px;
      overflow-x: auto;
    }

    /* Pages */
    .page { display: none; }
    .page.active { display: block; }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
    }

    /* Table */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .table-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .table-search {
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-family: var(--sans);
      outline: none;
      width: 220px;
      transition: border-color 0.2s;
    }

    .table-search:focus { border-color: var(--accent); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      padding: 10px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
      cursor: pointer;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }

    tbody td {
      padding: 11px 16px;
      vertical-align: middle;
    }

    .td-mono { font-family: var(--mono); }
    .td-muted { color: var(--text-muted); }

    /* Status badge */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge--new      { background: rgba(42,171,238,0.15);  color: var(--accent); }
    .badge--called   { background: rgba(240,165,0,0.15);   color: var(--warning); }
    .badge--accepted { background: rgba(52,208,88,0.15);   color: var(--success); }
    .badge--refused  { background: rgba(248,81,73,0.15);   color: var(--danger); }

    /* Pagination */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
    }

    .page-btn {
      padding: 5px 11px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
      font-family: var(--sans);
    }

    .page-btn:disabled { opacity: 0.3; cursor: default; }
    .page-btn:not(:disabled):hover { background: var(--border2); }

    /* Lead modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-title { font-size: 18px; font-weight: 700; }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      transition: color 0.15s;
    }

    .modal-close:hover { color: var(--text); }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .detail-item { display: flex; flex-direction: column; gap: 3px; }

    .detail-key {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
    }

    .detail-val {
      font-size: 13.5px;
      color: var(--text);
    }

    .detail-val.mono { font-family: var(--mono); }

    .status-select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      outline: none;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .notes-textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      resize: vertical;
      min-height: 80px;
      outline: none;
      transition: border-color 0.2s;
    }

    .notes-textarea:focus { border-color: var(--accent); }

    .btn-save {
      padding: 10px 22px;
      background: var(--accent);
      color: #fff;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-save:hover { opacity: 0.88; }

    .pdf-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--accent);
      font-size: 13px;
      text-decoration: none;
    }

    .pdf-link:hover { text-decoration: underline; }

    /* Prices page */
    .prices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .price-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .price-section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 12px;
    }

    .price-row-label {
      font-size: 13px;
      color: var(--text);
      flex: 1;
    }

    .price-input {
      width: 110px;
      padding: 7px 10px;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 7px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      text-align: right;
      outline: none;
      transition: border-color 0.2s;
    }

    .price-input:focus { border-color: var(--accent); }

    .save-prices-btn {
      margin-top: 24px;
      padding: 12px 28px;
      background: var(--accent);
      color: #fff;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.18s, transform 0.15s;
    }

    .save-prices-btn:hover  { opacity: 0.9; }
    .save-prices-btn:active { transform: scale(0.98); }

    .save-msg {
      display: none;
      margin-left: 14px;
      font-size: 13px;
      color: var(--success);
    }

    /* Empty + loading */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 700px) {
      .sidebar { display: none; }
      .main-content { padding: 20px 16px; }
      .detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════
     ЭКРАН ВХОДА
═══════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🏠</div>
    <div class="login-title">СтройДом</div>
    <div class="login-sub">Панель управления · Вход</div>

    <label class="field-label" for="pwd-input">Пароль</label>
    <input
      type="password"
      id="pwd-input"
      class="field-input"
      placeholder="••••••••"
      autocomplete="current-password"
    >
    <button class="btn-primary" id="login-btn">Войти</button>
    <div class="login-error" id="login-error">Неверный пароль</div>
  </div>
</div>


<!-- ═══════════════════════════════════════
     ОСНОВНОЙ ИНТЕРФЕЙС
═══════════════════════════════════════ -->
<div id="app-screen">
  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-name">🏠 СтройДом</div>
        <div class="sidebar-brand-sub">Панель управления</div>
      </div>

      <button class="nav-item active" data-page="leads">
        <span class="icon">📋</span> Заявки
      </button>
      <button class="nav-item" data-page="prices">
        <span class="icon">💰</span> Цены
      </button>

      <div class="sidebar-footer">
        <button class="logout-btn" id="logout-btn">Выйти</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main-content">

      <!-- ── СТРАНИЦА ЗАЯВОК ─────────────────── -->
      <div class="page active" id="page-leads">

        <div class="stats-row" id="stats-row">
          <div class="stat-card">
            <div class="stat-label">Всего заявок</div>
            <div class="stat-value" id="stat-total">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Новые</div>
            <div class="stat-value" id="stat-new">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">В работе</div>
            <div class="stat-value" id="stat-called">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Договоры</div>
            <div class="stat-value" id="stat-accepted">—</div>
          </div>
        </div>

        <div class="table-wrap">
          <div class="table-toolbar">
            <div style="font-size:14px; font-weight:600; color:var(--text)">Заявки</div>
            <input
              type="text"
              class="table-search"
              id="leads-search"
              placeholder="Поиск по имени, телефону..."
            >
          </div>

          <div id="leads-table-container">
            <div class="empty-state"><span class="spinner"></span> Загрузка...</div>
          </div>

          <div class="pagination" id="pagination"></div>
        </div>
      </div>


      <!-- ── СТРАНИЦА ЦЕН ───────────────────── -->
      <div class="page" id="page-prices">
        <div class="page-title">💰 Управление ценами</div>

        <div class="prices-grid" id="prices-grid">
          <div class="empty-state"><span class="spinner"></span> Загрузка...</div>
        </div>

        <div style="margin-top:24px; display:flex; align-items:center">
          <button class="save-prices-btn" id="save-prices-btn">Сохранить цены</button>
          <span class="save-msg" id="save-msg">✓ Сохранено</span>
        </div>
      </div>

    </main>
  </div>
</div>


<!-- ── МОДАЛЬНОЕ ОКНО ЛИДА ─────────────── -->
<div class="modal-overlay" id="lead-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-name">—</div>
      <button class="modal-close" id="modal-close">×</button>
    </div>

    <div class="detail-grid" id="modal-details"></div>

    <div style="margin-bottom:8px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px; color:var(--text-muted)">Статус</div>
    <select class="status-select" id="modal-status">
      <option value="new">🔵 Новая</option>
      <option value="called">🟡 Звонили</option>
      <option value="accepted">🟢 Договор</option>
      <option value="refused">🔴 Отказ</option>
    </select>

    <div style="margin-bottom:8px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px; color:var(--text-muted)">Заметка</div>
    <textarea class="notes-textarea" id="modal-notes" placeholder="Любые заметки по клиенту..."></textarea>

    <div style="margin-top:16px; display:flex; align-items:center; gap:16px;">
      <button class="btn-save" id="modal-save">Сохранить</button>
      <a id="modal-pdf" class="pdf-link" href="#" target="_blank" style="display:none">📄 Скачать смету</a>
    </div>
  </div>
</div>


<script>
// ═══════════════════════════════════════
// КОНФИГУРАЦИЯ
// ═══════════════════════════════════════
const API = '';  // Пустая строка = текущий хост

let token = localStorage.getItem('admin_token');
let currentLeadId = null;
let currentPage = 1;
const PAGE_SIZE = 50;
let allLeads = [];

// ═══════════════════════════════════════
// УТИЛИТЫ
// ═══════════════════════════════════════
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

function fmtPrice(n) {
  if (!n && n !== 0) return '—';
  return Math.round(n).toLocaleString('ru-RU') + ' ₽';
}

const REGION_LABELS = { kaluga: 'Калужская обл.', obninsk: 'Обнинск', moscow_obl: 'МО', new_moscow: 'Новая Москва' };
const FLOOR_LABELS  = { single: '1 этаж', mansard: 'Мансарда', double: '2 этажа' };
const STATUS_LABELS = { new: '🔵 Новая', called: '🟡 Звонили', accepted: '🟢 Договор', refused: '🔴 Отказ' };
const STATUS_BADGE  = { new: 'badge--new', called: 'badge--called', accepted: 'badge--accepted', refused: 'badge--refused' };

function statusBadge(s) {
  const cls = STATUS_BADGE[s] || '';
  return `<span class="badge ${cls}">${STATUS_LABELS[s] || s}</span>`;
}

async function apiFetch(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token,
      ...(opts.headers || {}),
    },
  });
  return res;
}

// ═══════════════════════════════════════
// АВТОРИЗАЦИЯ
// ═══════════════════════════════════════
if (token) showApp();

document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('pwd-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const pwd = document.getElementById('pwd-input').value;
  const err = document.getElementById('login-error');

  try {
    const res  = await fetch(API + '/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd }),
    });
    const json = await res.json();

    if (json.ok && json.token) {
      token = json.token;
      localStorage.setItem('admin_token', token);
      err.style.display = 'none';
      showApp();
    } else {
      err.style.display = 'block';
    }
  } catch {
    err.textContent = 'Ошибка соединения с сервером';
    err.style.display = 'block';
  }
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  loadLeads();
}

document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem('admin_token');
  token = null;
  location.reload();
});

// ═══════════════════════════════════════
// НАВИГАЦИЯ
// ═══════════════════════════════════════
document.querySelectorAll('.nav-item[data-page]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-' + btn.dataset.page).classList.add('active');
    if (btn.dataset.page === 'prices') loadPrices();
  });
});

// ═══════════════════════════════════════
// ЛИДЫ
// ═══════════════════════════════════════
async function loadLeads() {
  try {
    const res  = await apiFetch(`/api/admin/leads?limit=500`);
    const json = await res.json();

    if (!json.ok) { handleUnauth(res.status); return; }

    allLeads = json.leads || [];
    renderLeads(allLeads);
    renderStats(allLeads);
  } catch {
    document.getElementById('leads-table-container').innerHTML =
      '<div class="empty-state">Ошибка загрузки</div>';
  }
}

function handleUnauth(status) {
  if (status === 401) {
    localStorage.removeItem('admin_token');
    location.reload();
  }
}

function renderStats(leads) {
  document.getElementById('stat-total').textContent    = leads.length;
  document.getElementById('stat-new').textContent      = leads.filter(l => l.status === 'new').length;
  document.getElementById('stat-called').textContent   = leads.filter(l => l.status === 'called').length;
  document.getElementById('stat-accepted').textContent = leads.filter(l => l.status === 'accepted').length;
}

function renderLeads(leads) {
  const container = document.getElementById('leads-table-container');

  if (!leads.length) {
    container.innerHTML = '<div class="empty-state">Заявок пока нет</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  const start = (currentPage - 1) * PAGE_SIZE;
  const page  = leads.slice(start, start + PAGE_SIZE);

  container.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Дата</th>
          <th>Имя</th>
          <th>Телефон</th>
          <th>Регион</th>
          <th>Площадь</th>
          <th>Сумма</th>
          <th>Статус</th>
        </tr>
      </thead>
      <tbody>
        ${page.map(l => `
          <tr data-id="${l.id}">
            <td class="td-mono td-muted">${fmtDate(l.created_at).split(' ')[0]}</td>
            <td style="font-weight:500">${l.name}</td>
            <td class="td-mono">${l.phone}</td>
            <td>${REGION_LABELS[l.region] || l.region || '—'}</td>
            <td class="td-mono">${l.area ? l.area + ' м²' : '—'}</td>
            <td class="td-mono">${fmtPrice(l.total)}</td>
            <td>${statusBadge(l.status)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;

  document.querySelectorAll('tbody tr[data-id]').forEach(row => {
    row.addEventListener('click', () => openLead(row.dataset.id));
  });

  renderPagination(leads.length);
}

function renderPagination(total) {
  const pages  = Math.ceil(total / PAGE_SIZE);
  const pg     = document.getElementById('pagination');
  if (pages <= 1) { pg.innerHTML = ''; return; }

  pg.innerHTML = `
    <span>${currentPage} из ${pages}</span>
    <button class="page-btn" id="pg-prev" ${currentPage === 1 ? 'disabled' : ''}>← Назад</button>
    <button class="page-btn" id="pg-next" ${currentPage === pages ? 'disabled' : ''}>Вперёд →</button>`;

  document.getElementById('pg-prev')?.addEventListener('click', () => { currentPage--; renderLeads(filteredLeads()); });
  document.getElementById('pg-next')?.addEventListener('click', () => { currentPage++; renderLeads(filteredLeads()); });
}

// Поиск
let searchQ = '';
document.getElementById('leads-search').addEventListener('input', e => {
  searchQ = e.target.value.toLowerCase().trim();
  currentPage = 1;
  renderLeads(filteredLeads());
});

function filteredLeads() {
  if (!searchQ) return allLeads;
  return allLeads.filter(l =>
    (l.name  || '').toLowerCase().includes(searchQ) ||
    (l.phone || '').toLowerCase().includes(searchQ)
  );
}

// ═══════════════════════════════════════
// МОДАЛЬНОЕ ОКНО ЛИДА
// ═══════════════════════════════════════
async function openLead(id) {
  currentLeadId = id;
  const res  = await apiFetch(`/api/admin/leads/${id}`);
  const json = await res.json();
  if (!json.ok) return;

  const l = json.lead;
  document.getElementById('modal-name').textContent = l.name;

  const LABELS = {
    foundation: { pile: 'Свайный', strip: 'Ленточный', slab: 'Монолит', ushp: 'УШП' },
    finishing:  { shell: 'Коробка', rough: 'Черновая', whitebox: 'Вайт бокс', turnkeyEco: 'Под ключ Эконом', turnkeyStd: 'Под ключ Стандарт' },
    facade:     { plaster: 'Штукатурка', brick: 'Кирпич', panel: 'Панель', none: 'Нет' },
  };

  const details = [
    ['Телефон',    `<span class="mono">${l.phone}</span>`],
    ['Дата',       fmtDate(l.created_at)],
    ['Регион',     REGION_LABELS[l.region] || l.region || '—'],
    ['Площадь',    l.area ? `${l.area} м²` : '—'],
    ['Этажность',  FLOOR_LABELS[l.floors] || l.floors || '—'],
    ['Фундамент',  LABELS.foundation[l.foundation] || l.foundation || '—'],
    ['Фасад',      LABELS.facade[l.facade] || l.facade || '—'],
    ['Отделка',    LABELS.finishing[l.finishing] || l.finishing || '—'],
    ['Сумма',      `<span class="mono">${fmtPrice(l.total)}</span>`],
    ['Telegram',   l.tg_username ? `@${l.tg_username}` : (l.tg_user_id || '—')],
  ];

  document.getElementById('modal-details').innerHTML = details
    .map(([k, v]) => `<div class="detail-item"><div class="detail-key">${k}</div><div class="detail-val">${v}</div></div>`)
    .join('');

  document.getElementById('modal-status').value = l.status || 'new';
  document.getElementById('modal-notes').value  = l.notes  || '';

  const pdfLink = document.getElementById('modal-pdf');
  if (l.pdf_url) {
    pdfLink.href = l.pdf_url;
    pdfLink.style.display = 'inline-flex';
  } else {
    pdfLink.style.display = 'none';
  }

  document.getElementById('lead-modal').classList.add('open');
}

document.getElementById('modal-close').addEventListener('click', () => {
  document.getElementById('lead-modal').classList.remove('open');
});

document.getElementById('lead-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('lead-modal'))
    document.getElementById('lead-modal').classList.remove('open');
});

document.getElementById('modal-save').addEventListener('click', async () => {
  if (!currentLeadId) return;
  const status = document.getElementById('modal-status').value;
  const notes  = document.getElementById('modal-notes').value;

  const res  = await apiFetch(`/api/admin/leads/${currentLeadId}`, {
    method: 'PATCH',
    body: JSON.stringify({ status, notes }),
  });
  const json = await res.json();

  if (json.ok) {
    // Обновить в локальном массиве
    const idx = allLeads.findIndex(l => l.id === currentLeadId);
    if (idx !== -1) { allLeads[idx].status = status; allLeads[idx].notes = notes; }
    renderLeads(filteredLeads());
    renderStats(allLeads);
    document.getElementById('lead-modal').classList.remove('open');
  }
});

let currentPrices = null;

async function loadPrices() {
  const grid = document.getElementById('prices-grid');
  grid.innerHTML = '<div class="empty-state"><span class="spinner"></span> Загрузка...</div>';

  const res  = await apiFetch('/api/admin/prices');
  const json = await res.json();
  if (!json.ok) { handleUnauth(res.status); return; }

  // Normalize DB column names to JS camelCase
  const p = json.prices;
  currentPrices = {
    boxPerSqm:    p.box_per_sqm    || p.boxPerSqm,
    foundation:   p.foundation,
    roofMaterial: p.roof_material  || p.roofMaterial,
    roofShape:    p.roof_shape     || p.roofShape,
    style:        p.style,
    facade:       p.facade,
    finishing:    p.finishing,
    options:      p.options,
    region:       p.region,
  };

  grid.innerHTML = PRICE_SECTIONS.map(sec => `
    <div class="price-section">
      <div class="price-section-title">${sec.title}</div>
      ${sec.rows.map(([k, label]) => `
        <div class="price-row">
          <span class="price-row-label">${label}</span>
          <input
            class="price-input"
            data-section="${sec.key}"
            data-key="${k}"
            value="${currentPrices[sec.key]?.[k] ?? ''}"
            type="number"
            step="${sec.key.includes('Coef') || ['roofMaterial','roofShape','style','region'].includes(sec.key) ? '0.01' : '100'}"
          >
        </div>
      `).join('')}
    </div>
  `).join('');
}

document.getElementById('save-prices-btn').addEventListener('click', async () => {
  const inputs = document.querySelectorAll('.price-input');
  const updated = {};

  inputs.forEach(inp => {
    const sec = inp.dataset.section;
    const key = inp.dataset.key;
    if (!updated[sec]) updated[sec] = {};
    updated[sec][key] = parseFloat(inp.value);
  });

  const res  = await apiFetch('/api/admin/prices', {
    method: 'PUT',
    body: JSON.stringify(updated),
  });
  const json = await res.json();

  const msg = document.getElementById('save-msg');
  if (json.ok) {
    msg.style.display = 'inline';
    setTimeout(() => { msg.style.display = 'none'; }, 3000);
  } else {
    msg.textContent  = '✕ Ошибка';
    msg.style.color  = 'var(--danger)';
    msg.style.display = 'inline';
    setTimeout(() => { msg.style.display = 'none'; msg.style.color = ''; msg.textContent = '✓ Сохранено'; }, 3000);
  }
});
